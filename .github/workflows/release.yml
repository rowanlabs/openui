name: Release

# Runs when you push a version tag such as 1.0.0 or 1.2.3
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release AAR
        run: ./gradlew :sdk:assembleRelease

      - name: Rename AAR with version
        run: cp sdk/build/outputs/aar/sdk-release.aar "openui-${GITHUB_REF_NAME}.aar"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: openui-${{ github.ref_name }}.aar